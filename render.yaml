# 1. Databases go in their own top-level section
databases:
  - name: toronto_pulse_db
    databaseName: toronto_pulse
    user: user
    plan: free

# 2. Web services (API and Frontend) go here
services:
  # The FastAPI Backend
  - type: web
    name: toronto-pulse-api
    env: docker
    plan: free
    region: ohio
    dockerContext: .
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: toronto_pulse_db
          property: connectionString

  # The React Frontend
  - type: web
    name: toronto-pulse-web
    env: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://toronto-pulse-api.onrender.com