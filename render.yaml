databases:
  - name: toronto_pulse_db
    databaseName: toronto_pulse
    user: user
    plan: free

services:
  # 1. The FastAPI Backend (Keep plan: free here)
  - type: web
    name: toronto-pulse-api
    env: docker
    plan: free
    region: oregon
    dockerContext: .
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: toronto_pulse_db
          property: connectionString

  # 2. The React Frontend (REMOVE plan: free here)
  - type: web
    name: toronto-pulse-web
    env: static
    # plan: free  <-- REMOVED THIS LINE
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://toronto-pulse-api.onrender.com